# Publication d'une version : pousser une étiquette égale au numéro de version
# (git tag 2026.12.0 && git push origin 2026.12.0). La release GitHub est créée avec
# ses notes, tirées de CHANGELOG.md ; le Marketplace de Home Assistant (ou HACS) la propose ensuite.
name: Publier

on:
  push:
    tags: ["20[0-9][0-9].[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  publier:
    name: Release GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: L'étiquette, le manifeste et le tableau portent le même numéro
        run: |
          etiquette="${GITHUB_REF_NAME}"
          manifeste=$(jq -r .version custom_components/automatic_dashboard/manifest.json)
          tableau=$(jq -r .version frontend/package.json)
          echo "étiquette $etiquette, manifeste $manifeste, tableau $tableau"
          test "$etiquette" = "$manifeste" && test "$etiquette" = "$tableau"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Le fichier du tableau publié est bien celui des sources
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code -- ../custom_components/automatic_dashboard/frontend/automatic-dashboard.js

      - name: Notes de version, tirées de CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME}" '$0==v{dedans=1;next} /^## /{if(dedans)exit} dedans' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Automatic Dashboard ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
