# Thème Automatic Dashboard, aux couleurs exactes du site (automatic-dashboard.github.io).
Automatic Dashboard:
  # Typographie : Inter, chargée par l'intégration, avec les replis du site
  ha-font-family-body: "Inter, 'Inter repli', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  ha-font-family-heading: "Inter, 'Inter repli', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  primary-font-family: "Inter, 'Inter repli', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  paper-font-common-base_-_font-family: "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

  # Formes : rayons du site (10, 16, 22 px)
  ha-card-border-radius: "22px"
  ha-card-border-width: "1px"
  ha-tile-icon-border-radius: "10px"
  tile-icon-border-radius: "10px"

